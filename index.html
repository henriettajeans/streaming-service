<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../dist/index.js" defer></script>
    <link rel="stylesheet" href="/src/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Ribeye&display=swap"
        rel="stylesheet">

    <title>Streaming service</title>
</head>

<body>
    <div class="wrapper">
        <section class="movie-wrapper">
        </section>
        <section class="single-movie">
            <h3 class="single-movie__title"></h3>
            <p class="single-movie__synopsis"></p>
            <button class="single-movie__play-btn">
                <span>Spela filmen</span>
            </button>
            <button class="single-movie__add-btn">
                <span class="single-movie__add-Btn__icon">Lägg till i din lista</span>
            </button>
        </section>
    </div>
    <button id="open-btn">Klicka</button>
    <dialog id="add-review-dialog">
        <form id="add-review-form">
            <h4>Lägg till</h4>
            <div>
                <button id="close-btn">Close</button>
            </div>
            <div>
                <label>Namn</label>
                <input type="text" id="name-input" placeholder="Henrietta" />

            </div>
            <div>
                <label>Meddelande</label>
                <input type="text" id="message-input" placeholder="Ditt meddelande..." />

            </div>
            <div>
                <label>Mejl</label>
                <input type="email" id="email-input" placeholder="mail@mail.se" />

            </div>
            <button id="submit-btn">Submit</button>
        </form>
    </dialog>
</body>

</html>
